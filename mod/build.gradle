plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// One version for the converter and the mod, written only in the repository's
// VERSION file; the jar name and neoforge.mods.toml are stamped from it.
ext.mod_version = rootProject.file('../VERSION').text.trim()

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players; compile and run against Java 21 only.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource sourceSets.main
    }

    client {
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    if (System.getProperty('src2mc.testBundle') != null) {
        systemProperty 'src2mc.testBundle', System.getProperty('src2mc.testBundle')
    }
}

tasks.withType(ProcessResources).configureEach {
    def properties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]

    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
