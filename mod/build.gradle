plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// One version for the converter and the mod, written only in the repository's
// VERSION file; the jar name and neoforge.mods.toml are stamped from it.
ext.mod_version = rootProject.file('../VERSION').text.trim()

// FML refuses to load a mod whose version does not start with a digit
// (ModInfo.VALID_VERSION, `^\d+.*`), so `DEV-0.6.0` is written into
// neoforge.mods.toml as `0.6.0-DEV`: the same version, stage moved to the end.
ext.mod_loader_version = { String version ->
    def staged = version =~ /^([A-Z]+)-(\d.*)$/
    def result = staged.matches() ? "${staged.group(2)}-${staged.group(1)}" : version
    if (!(result ==~ /^\d+.*/)) throw new GradleException("VERSION `${version}` has no form NeoForge will load")
    result
}(mod_version)

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players; compile and run against Java 21 only.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // Sable, which moves the maps' doors, lifts and trains (D21).
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://maven.ryanhcode.dev/releases'
                name = 'RyanHCode Maven'
            }
        }
        filter {
            includeGroup('dev.ryanhcode.sable')
            includeGroup('dev.ryanhcode.sable-companion')
        }
    }
}

minecraft {
    accessTransformers {
        file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource sourceSets.main
    }

    client {
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Compiled against only: the game loads Sable from its mods folder (the dev client's is
    // runs/client/mods), and neoforge.mods.toml makes it required.
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    testImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    testImplementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    if (System.getProperty('src2mc.testBundle') != null) {
        systemProperty 'src2mc.testBundle', System.getProperty('src2mc.testBundle')
        if (System.getProperty('src2mc.churn') != null) systemProperty 'src2mc.churn', 'true'
        if (System.getProperty('src2mc.particleDetail') != null) systemProperty 'src2mc.particleDetail', 'true'
    }
}

tasks.withType(ProcessResources).configureEach {
    def properties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        sable_version_range    : sable_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_loader_version,
    ]

    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
